<section class="cta-banner rounded-5 overflow-hidden">

  <div class="bg-image"></div>
  <div class="bg-overlay"></div>

  <div class="container position-relative py-5 px-4 px-lg-5">

    <!-- Trust Badges -->
    <div class="d-flex flex-wrap justify-content-center gap-4 mb-4 cta-text">

      <span class="d-flex align-items-center">
        <i class="bi bi-patch-check-fill text-success me-2"></i>
        Quality Construction
      </span>

      <span class="d-flex align-items-center">
        <i class="bi bi-patch-check-fill text-success me-2"></i>
        Experienced Team
      </span>

      <span class="d-flex align-items-center">
        <i class="bi bi-patch-check-fill text-success me-2"></i>
        On-Time Delivery
      </span>

      <span class="d-flex align-items-center">
        <i class="bi bi-patch-check-fill text-success me-2"></i>
        Affordable Pricing
      </span>

    </div>

    <div class="row justify-content-center">

      <div class="col-lg-9 text-center">

        <h2 class="display-4 fw-bold cta-title mb-3">
          {{ title }}
        </h2>

        <p class="lead cta-text mb-5">
          {{ description }}
        </p>

        <div class="d-flex flex-column flex-sm-row justify-content-center gap-3">

          <a
            [routerLink]="actionLink"
            class="btn btn-warning btn-lg px-5 py-3 fw-semibold">

            {{ actionText }}
            <i class="bi bi-arrow-right ms-2"></i>

          </a>

          <a
            routerLink="/projects"
            class="btn btn-outline-light btn-lg px-5 py-3">

            View Projects

          </a>

        </div>

      </div>

    </div>

  </div>

</section>
