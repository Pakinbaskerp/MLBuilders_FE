<article class="card border-0 shadow-sm h-100">
  <div class="ratio ratio-16x9">
    <img
      appLazyImage
      class="img-fluid object-fit-cover"
      [src]="image.imageUrl"
      [imageAlt]="image.alt"
      [imageLoading]="image.loading ?? 'lazy'"
      [attr.title]="image.title"
    />
  </div>
  <div class="card-body">
    <h3 class="h5 card-title">{{ title }}</h3>
    <p class="card-text text-secondary mb-0">{{ description }}</p>
  </div>
</article>
