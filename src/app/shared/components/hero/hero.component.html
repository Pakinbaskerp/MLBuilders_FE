<section class="hero-section" [style.background-image]="'url(' + image.imageUrl + ')'">

  <div class="hero-overlay"></div>

  <div class="container position-relative">
    <div class="row align-items-center min-vh-100">

      <div class="col-lg-6 text-white">

        <span class="hero-tag">
          {{ tag }}
        </span>

        <h1 class="hero-title">
          {{ title }}
        </h1>

        <p class="hero-subtitle">
          {{ subtitle }}
        </p>

        <div class="d-flex flex-wrap gap-3 mt-4">
          <a
            [routerLink]="primaryActionLink"
            class="btn btn-warning btn-lg px-4">
            {{ primaryActionText }}
          </a>

          <a
            [routerLink]="secondaryActionLink"
            class="btn btn-outline-light btn-lg px-4">
            {{ secondaryActionText }}
          </a>
        </div>

      </div>

      <div class="col-lg-6 text-center">

        <div class="hero-image-frame mx-auto">
          <img
            appLazyImage
            class="hero-image"
            [src]="(secondaryImage ?? image).imageUrl"
            [imageAlt]="(secondaryImage ?? image).alt"
            [imageLoading]="(secondaryImage ?? image).loading ?? 'eager'">
        </div>

      </div>

    </div>
  </div>

</section>
