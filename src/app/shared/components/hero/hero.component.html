<section class="bg-light-blue py-5">
  <div class="container">
    <div class="row align-items-center g-4">
      <div class="col-12 col-lg-6 order-2 order-lg-1">
        <span class="badge text-bg-light text-primary mb-3">{{ tag }}</span>
        <h1 class="display-5 fw-bold mb-3">{{ title }}</h1>
        <p class="lead text-secondary mb-4">{{ subtitle }}</p>
        <div class="d-flex flex-wrap gap-2">
          <a [routerLink]="primaryActionLink" class="btn btn-ml-primary btn-ml-outline-orange">{{ primaryActionText }}</a>
          <a [routerLink]="secondaryActionLink" class="btn btn-ml-outline btn-ml-outline-orange">{{ secondaryActionText }}</a>
        </div>
      </div>
      <div class="col-12 col-lg-6 order-1 order-lg-2">
        <div class="ratio ratio-4x3 rounded-4 overflow-hidden shadow-sm">
          <img
            appLazyImage
            class="img-fluid object-fit-cover w-100 h-100"
            [src]="image.imageUrl"
            [imageAlt]="image.alt"
            [imageLoading]="image.loading ?? 'eager'"
            [attr.title]="image.title"
          />
        </div>
      </div>
    </div>
  </div>
</section>
