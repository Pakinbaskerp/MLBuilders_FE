<article class="project-tile">
  <div
    class="ratio ratio-4x3 card-image-trigger"
    role="button"
    tabindex="0"
    [attr.data-bs-toggle]="modalTarget ? 'modal' : null"
    [attr.data-bs-target]="modalTarget ? '#' + modalTarget : null"
    [attr.aria-label]="'View full image of ' + title"
    (click)="imageClick.emit()"
    (keydown.enter)="imageClick.emit()">
    <img
      appLazyImage
      class="project-tile__img"
      [src]="image.imageUrl"
      [imageAlt]="image.alt"
      [imageLoading]="image.loading ?? 'lazy'"
      [attr.title]="image.title"
    />
  </div>

  <div class="project-tile__overlay">
    <span class="project-tile__category">{{ category }}</span>
    <h3 class="project-tile__title">{{ title }}</h3>
    <p class="project-tile__location">
      <i class="bi bi-geo-alt-fill me-1"></i>{{ location }}
    </p>
  </div>
</article>
