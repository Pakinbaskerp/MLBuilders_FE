<article class="project-tile">
  <div class="ratio ratio-4x3">
    <img
      appLazyImage
      class="project-tile__img"
      [src]="image.imageUrl"
      [imageAlt]="image.alt"
      [imageLoading]="image.loading ?? 'lazy'"
      [attr.title]="image.title"
    />
  </div>

  <div class="project-tile__overlay">
    <span class="project-tile__category">{{ category }}</span>
    <h3 class="project-tile__title">{{ title }}</h3>
    <p class="project-tile__location">
      <i class="bi bi-geo-alt-fill me-1"></i>{{ location }}
    </p>
  </div>
</article>
